# Проверка опечаток: typos
[default.extend-words]
# AIMD — Additive Increase / Multiplicative Decrease, не опечатка
AIMD = "AIMD"
aimd = "aimd"
# имя крейта сжатия flate2: typos режет его на «flate» и цифру
flate = "flate"
# аргумент компилятора ресурсов Windows (/fo) — не опечатка
fo = "fo"
# ERROR_FILENAME_EXCED_RANGE — так называется константа Windows (EXCED, а не EXCEED),
# переименовывать её нельзя: имя приходит из системы
EXCED = "EXCED"
# Tilda — конструктор сайтов, название продукта (не «tilde»)
Tilda = "Tilda"
tilda = "tilda"

[files]
extend-exclude = ["target/", "legacy/", "landing/assets/"]
