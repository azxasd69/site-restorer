[package]
name = "site-restorer"
version = "3.6.0"
edition = "2024"
# Минимальная поддерживаемая версия (Д-61). Edition 2024 требует 1.85,
# но код использует let-chains в условиях — они стабилизированы в 1.88.
rust-version = "1.88"
# Минимальная поддерживаемая версия (Д-61). Edition 2024 требует 1.85,
# но код использует let-chains в условиях — они стабилизированы в 1.88.
description = "Восстановление сайта из веб-архива: нативный GUI + CLI"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
encoding_rs = "0.8.44"
rayon = "1.12"
regex = "1.13"
ureq = "3.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Профиль релиза — по политике платформ (docs/PLATFORMS.md).
#
# Замер 12.11.2026, GUI windows-x64: opt-level="z"+lto=true → 7,2 МБ;
# opt-level=3+lto="thin"+debug="line-tables-only" → 8,7 МБ. Разница 1,5 МБ при
# норме ПР-6 45 МБ, поэтому принят профиль политики: он даёт более быстрый код и
# читаемые строки в отладочной информации. Отладочные символы в поставку не идут:
# CI забирает .pdb отдельным артефактом (cargo делает его при split-debuginfo).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
panic = "abort"
strip = "none"


