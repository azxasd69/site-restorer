[package]
name = "site-restorer"
version = "3.3.0"
edition = "2024"
description = "Восстановление сайта из веб-архива: нативный GUI + CLI"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
encoding_rs = "0.8.44"
regex-lite = "0.1"
ureq = "3.5.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
