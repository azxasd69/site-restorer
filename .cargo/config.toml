# Базовая ISA и линковка по платформам (docs/PLATFORMS.md).
#
# Это ЕДИНСТВЕННЫЙ источник флагов сборки (ПР-15, Д-69): конвейер переменную
# RUSTFLAGS для релизных ячеек не задаёт, иначе файл и CI молча расходятся.
# Проверка — scripts/check-flags.py (входит в гейты).
#
# Эти значения действуют и локально, и в конвейере: CI берёт их отсюда, а не
# задаёт переменную. Помните при правках: если задать RUSTFLAGS вручную, она
# ПОЛНОСТЬЮ перекрывает rustflags из этого файла, а не дополняет их.
#
# Базовая ISA зафиксирована как x86-64 (SSE2). Запрещены: target-cpu=native и
# любые x86-64-v2/v3/v4, глобальные +avx,+avx2,+fma,+sse4.*. Ускорения — только
# runtime dispatch с обязательным скалярным путём.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64", "-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-unknown-linux-musl]
# Линковщик переехал сюда из матрицы конвейера (Д-69): флаги и линковка заданы
# в одном месте, а конвейер RUSTFLAGS не передаёт.
linker = "musl-gcc"
rustflags = ["-C", "target-cpu=x86-64"]
