name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile check
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x64
            out: SiteRestorer.exe
          - arch: x86
            python_arch: x86
            out: SiteRestorer-x86.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3

      - name: Build
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name SiteRestorer `
            --icon src/app.ico --add-data "src/app.ico;." `
            --distpath dist --workpath build --specpath . `
            src/main.py

      - name: Rename artifact
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "x86") {
            Move-Item dist/SiteRestorer.exe dist/${{ matrix.out }}
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: SiteRestorer-${{ matrix.arch }}
          path: dist/${{ matrix.out }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.out }}
          generate_release_notes: true

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SiteRestorer-x64
          path: dist/x64
      - uses: actions/download-artifact@v4
        with:
          name: SiteRestorer-x86
          path: dist/x86

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify artifacts (size + PE architecture, no network)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $x64 = "dist/x64/SiteRestorer.exe"
          $x86 = "dist/x86/SiteRestorer-x86.exe"
          foreach ($f in @($x64, $x86)) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            $size = (Get-Item $f).Length
            Write-Host "$f = $([math]::Round($size/1MB,1)) MB"
            if ($size -lt 5MB) { throw "$f is too small" }
          }
          python -c "import struct,sys; d=open(sys.argv[1],'rb').read(4096); e=struct.unpack_from('<I',d,0x3c)[0]; m=struct.unpack_from('<H',d,e+4)[0]; print('machine', hex(m)); sys.exit(0 if m==0x8664 else 1)" $x64
          python -c "import struct,sys; d=open(sys.argv[1],'rb').read(4096); e=struct.unpack_from('<I',d,0x3c)[0]; m=struct.unpack_from('<H',d,e+4)[0]; print('machine', hex(m)); sys.exit(0 if m==0x14c else 1)" $x86
          Write-Host "OK: x64 and x86 binaries are valid"
