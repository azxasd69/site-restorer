name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Проверки кода. Сборки начинаются только после них.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Готовые бинарники инструментов — без сборки из исходников.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-machete,cargo-deny,typos

      # Единый источник версии — Cargo.toml. Тег обязан совпадать.
      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag cargo=$ver"
          test "$tag" = "$ver" || { echo "::error::тег $tag не совпадает с версией в Cargo.toml ($ver)"; exit 1; }

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy (CLI, warnings as errors)
        run: cargo clippy --all-targets --release --no-default-features -- -D warnings

      - name: Rust tests (CLI)
        run: cargo nextest run --release --no-default-features

      - name: Rust advisories
        run: cargo audit

      - name: Rust dependency policy
        run: cargo deny check

      - name: Rust unused dependencies
        run: cargo machete

      - name: Typos
        run: typos

  # Имена ассетов: SiteRestorer-<os>-<arch>[-cli][.exe], без версии — чтобы
  # ссылки releases/latest/download/<имя> не менялись от релиза к релизу.
  # Windows-сборки линкуются со статическим CRT (+crt-static): иначе exe требует
  # установленный Visual C++ Redistributable и на чистой системе не стартует
  # (проверено на Win10 x86: код 0xC0000135).
  rust:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: "cli"
            apt: musl-tools
            rustflags: "-C linker=musl-gcc -C target-cpu=x86-64"
            out: SiteRestorer-linux-x64-cli
            max_mb: 15
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "gui"
            apt: >-
              libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev
              libxrandr-dev libxi-dev libwayland-dev libfontconfig1-dev
            rustflags: "-C target-cpu=x86-64"
            # Д-58: собираем с полом glibc 2.28 через zigbuild
            glibc: "2.28"
            out: SiteRestorer-linux-x64-gui
            max_mb: 45
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "gui"
            apt: ""
            rustflags: "-C target-cpu=x86-64 -C target-feature=+crt-static"
            out: SiteRestorer-windows-x64.exe
            max_mb: 45
          - os: windows-latest
            target: i686-pc-windows-msvc
            features: "gui"
            apt: ""
            rustflags: "-C target-cpu=x86-64 -C target-feature=+crt-static"
            out: SiteRestorer-windows-x86.exe
            max_mb: 35
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "cli"
            apt: ""
            rustflags: "-C target-cpu=x86-64 -C target-feature=+crt-static"
            out: SiteRestorer-windows-x64-cli.exe
            max_mb: 15
          - os: windows-latest
            target: i686-pc-windows-msvc
            features: "cli"
            apt: ""
            rustflags: "-C target-cpu=x86-64 -C target-feature=+crt-static"
            out: SiteRestorer-windows-x86-cli.exe
            max_mb: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Зеркала Ubuntu на раннерах иногда не отвечают (Ign -> exit 100): без повторов
      # выпуск падает из-за сети, хотя код в порядке.
      - name: System libraries
        if: matrix.apt != ''
        run: |
          # ForceIPv4 и внутренние повторы apt: раннеры иногда не имеют маршрута по IPv6,
          # и тогда apt молча не подключается к зеркалу (Ign -> exit 100).
          # Повторы внутри apt держим короткими: при недоступном зеркале длинные
          # таймауты растягивают задачу на полчаса вместо быстрой повторной попытки.
          APT="sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15"
          for attempt in 1 2 3; do
            if $APT update && $APT install -y ${{ matrix.apt }}; then
              exit 0
            fi
            echo "попытка $attempt не удалась, пауза и повтор"
            sleep 5
          done
          echo "::error::системные библиотеки не установились после трёх попыток"
          exit 1

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      # Д-58: пол glibc 2.28. zigbuild заменяет системный линковщик и подставляет
      # нужную версию символов; без него сборка на ubuntu-latest требует 2.39.
      - name: Install zig for glibc floor
        if: matrix.glibc != ''
        run: |
          set -e
          python3 -m pip install --user ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
          zig version || python3 -c "import ziglang, shutil, sys; print(shutil.which('python3'))"

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          FLAGS=""
          if [ "${{ matrix.features }}" = "cli" ]; then FLAGS="--no-default-features"; fi
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}.${{ matrix.glibc }} $FLAGS
          else
            cargo build --release --target ${{ matrix.target }} $FLAGS
          fi

      # Clippy для gui-сборки: в test-джобе проверяется только CLI.
      - name: Clippy (gui)
        if: matrix.features == 'gui' && matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --release -- -D warnings

      # Политика платформ: собранное под glibc-раннером не должно требовать
      # версию выше 2.28, иначе двоичник не запустится на RHEL 8 / Debian 10.
      - name: glibc floor (только linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          # Д-58 сделан: с zigbuild пол обязателен, отступлений больше нет.
          GLIBC_FLOOR_STRICT: "1"
        run: |
          set -e
          SRC="target/${{ matrix.target }}/release/site-restorer"
          MAX=$(objdump -T "$SRC" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
          echo "максимальная требуемая версия glibc: $MAX"
          if [ "$(printf '%s\n' "$MAX" | sed 's/GLIBC_//')" \> "2.28" ]; then
            echo "::error::бинарник требует glibc $MAX — политика разрешает не выше 2.28"
            exit 1
          fi

      # Д-63: защиты ELF — PIE, RELRO, немедленная привязка символов.
      - name: ELF hardening (linux)
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: |
          set -e
          SRC="target/${{ matrix.target }}/release/site-restorer"
          readelf -h "$SRC" | grep -q "Type:.*DYN" || { echo "::error::нет PIE"; exit 1; }
          readelf -l "$SRC" | grep -q "GNU_RELRO" || { echo "::error::нет RELRO"; exit 1; }
          readelf -d "$SRC" | grep -q "BIND_NOW" || { echo "::error::нет BIND_NOW"; exit 1; }
          echo "ELF: PIE, RELRO, BIND_NOW — на месте"

      # Манифест Windows: asInvoker, PerMonitorV2, longPathAware, supportedOS.
      # Д-63: защиты PE — ASLR с высокой энтропией, DEP, Control Flow Guard.
      - name: Windows mitigations
        if: startsWith(matrix.target, 'x86_64-pc-windows')
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/site-restorer.exe"
          $dumpbin = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { Write-Output "dumpbin не найден — проверка пропущена"; exit 0 }
          $h = & $dumpbin.FullName /nologo /headers $exe 2>&1 | Out-String
          $need = @('High Entropy Virtual Addresses', 'Dynamic base', 'NX compatible', 'Control Flow Guard')
          $missing = @()
          foreach ($n in $need) { if ($h -notmatch [regex]::Escape($n)) { $missing += $n } }
          if ($missing) { Write-Error ("нет защит: " + ($missing -join ', ')); exit 1 }
          Write-Output "PE: $($need -join ', ') — на месте"

      - name: Windows manifest
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'i686-pc-windows')
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/site-restorer.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          $need = @('longPathAware', 'PerMonitorV2', 'asInvoker', '8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a')
          $missing = $need | Where-Object { -not $text.Contains($_) }
          if ($missing) { Write-Error "в манифесте нет: $($missing -join ', ')"; exit 1 }
          Write-Output "манифест на месте: $($need -join ', ')"

      # Д-62: cfg-ветви не должны гнить — проверяем каждый таргет, а не только хост.
      - name: Check target (${{ matrix.target }})
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -e
          if [ "${{ matrix.features }}" = "cli" ]; then FLAGS="--no-default-features"; fi
          cargo check --release --target ${{ matrix.target }} $FLAGS

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/site-restorer"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then SRC="${SRC}.exe"; fi
          cp "$SRC" "dist/${{ matrix.out }}"
          ls -l "dist/${{ matrix.out }}"

      # Бинарник обязан запускаться и печатать версию из Cargo.toml.
      - name: Smoke test (--version)
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          out=$(./dist/${{ matrix.out }} --version)
          echo "$out"
          echo "$out" | grep -q "$ver" || { echo "::error::--version не совпал с $ver"; exit 1; }

      # Лимиты подняты на ~0,3–0,6 МБ в 3.5.1: переписывание ссылок перешло с regex-lite
      # на regex (DFA) — сборка копии ускорилась в 2–10 раз, см. docs/build-performance.md.
      - name: Size limit
        shell: bash
        run: |
          bytes=$(wc -c < "dist/${{ matrix.out }}")
          mb=$(awk "BEGIN{printf \"%.2f\", $bytes/1048576}")
          echo "${{ matrix.out }}: ${mb} MB (лимит ${{ matrix.max_mb }} MB)"
          awk "BEGIN{exit !($mb <= ${{ matrix.max_mb }})}" || { echo "::error::ассет больше лимита"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}-${{ matrix.features }}
          path: dist/${{ matrix.out }}

      # Отладочные символы архивируются, но в дистрибутив не попадают
      # (политика платформ: PDB/dSYM — артефакт сборки, не поставка).
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'i686-pc-windows')
        continue-on-error: true
        with:
          name: pdb-${{ matrix.target }}-${{ matrix.features }}
          path: target/${{ matrix.target }}/release/site-restorer.pdb
          if-no-files-found: ignore

  # Д-61: объявленная минимальная версия должна собираться на деле, иначе она
  # превращается в строчку в Cargo.toml без смысла.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup override set 1.88

      - name: Check on MSRV
        env:
          RUSTFLAGS: "-C target-cpu=x86-64"
        run: cargo check --no-default-features

  # Перечень состава сборки (SBOM, CycloneDX) — требование политики платформ.
  # Генерируется своим скриптом из Cargo.lock: не зависит от установки
  # cargo-cyclonedx (она падала в конвейере) и не требует сети.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SBOM
        run: |
          set -e
          python3 tools/sbom.py > sbom.cdx.json
          ls -l sbom.cdx.json
          python3 -c "import json; d=json.load(open('sbom.cdx.json')); print('компонентов:', len(d['components']))"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust, sbom]
    runs-on: ubuntu-latest
    steps:
      # checkout первым: его git clean удаляет untracked-файлы, поэтому
      # скачанные артефакты должны появиться уже после него
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # SBOM кладём рядом с бинарниками: имя без каталога, чтобы попал в SHA256SUMS.
      - name: SBOM into assets
        run: |
          set -e
          if [ -f assets/sbom.cdx.json ]; then mv assets/sbom.cdx.json assets/SBOM-site-restorer.cdx.json; fi
          ls -la assets

      - name: Package Linux bundle
        run: |
          set -e
          mkdir -p bundle/site-restorer-linux-x64/share/applications
          mkdir -p bundle/site-restorer-linux-x64/share/icons
          install -m755 assets/SiteRestorer-linux-x64-cli bundle/site-restorer-linux-x64/site-restorer
          install -m755 assets/SiteRestorer-linux-x64-gui bundle/site-restorer-linux-x64/site-restorer-gui
          install -m644 packaging/linux/site-restorer.desktop bundle/site-restorer-linux-x64/share/applications/
          install -m644 packaging/linux/site-restorer.svg bundle/site-restorer-linux-x64/share/icons/
          install -m644 packaging/linux/icons/site-restorer-256.png bundle/site-restorer-linux-x64/share/icons/
          install -m755 packaging/linux/install.sh bundle/site-restorer-linux-x64/
          install -m644 packaging/linux/README.txt bundle/site-restorer-linux-x64/
          tar -C bundle -czf assets/SiteRestorer-linux-x64.tar.gz site-restorer-linux-x64
          # Linux-бинарники остаются и отдельными файлами: бандл удобен не всем.
          ls -la assets

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Релиз-ноты берём из CHANGELOG, а не из списка коммитов.
      # python, а не awk: файл может приехать с CRLF, а заголовок содержит «—».
      # Текст передаём действию через output, а не через body_path: относительный
      # путь у action-gh-release молча не читается и старый текст остаётся.
      - name: Release notes from CHANGELOG
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re, sys, pathlib
          tag = sys.argv[1]
          ver = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").replace("\r\n", "\n")
          pattern = re.compile(rf"^##\s+{re.escape(ver)}\b.*$", re.M)
          match = pattern.search(text)
          if not match:
              sys.exit(f"В CHANGELOG.md нет раздела {ver}")
          rest = text[match.end():]
          nxt = re.search(r"^##\s", rest, re.M)
          body = text[match.start(): match.end() + (nxt.start() if nxt else len(rest))]
          pathlib.Path("RELEASE_NOTES.md").write_text(
              body.strip() + "\n\nСборка: Rust. Контрольные суммы — в SHA256SUMS.txt.\n",
              encoding="utf-8")
          PY
          echo "релиз-ноты: $(wc -c < RELEASE_NOTES.md) байт"

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: false

      # Текст ставим отдельным шагом через gh: softprops при пустом значении
      # body молча оставляет прежний текст, и ошибку не видно.
      - name: Release notes (body)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
