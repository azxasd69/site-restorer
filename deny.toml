# Политика зависимостей (cargo-deny). Проверка: cargo deny check

[advisories]
version = 2
# Уязвимости блокируют сборку; yanked-версии — предупреждение.
yanked = "warn"

[licenses]
version = 2
# Всё, что реально встречается в дереве, и всё это разрешает распространение
# бинарника: MIT, Apache-2.0, BSD, ISC, Zlib, BSL-1.0, Unlicense, 0BSD,
# шрифт epaint (OFL-1.1 + Ubuntu-font-1.0), данные webpki-roots (CDLA-Permissive-2.0).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Дубли версий — предупреждение: тянем чужие деревья (eframe/ureq), не наши.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
